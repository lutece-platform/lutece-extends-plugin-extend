################################################################################
# Configuration file for Extend plugin

# Items per page
extend.listResourceExtenders.itemsPerPage=50
extend.listHistories.itemsPerPage=50

# The content post processor is used to display the social html content
# Choose the value of this property wisely : either performance or accessibility
# True : The content post processor is displayed in ajax (client side)
# False : The process is carried out in server side
extend.contentPostProcessor.clientSide=false

extend.extenderStringMapper.delimeter=,

extend.extendableContentPostProcessor.regexPattern=@Extender\\[([^\\]@]*)\\]@
extend.extendableContentPostProcessor.extenderParameterRegexPattern=@ExtenderParameter\\[([^\\]@]*)\\]@

extend.hit.titleKey="module.extend.hit.extender.labelHit"
extend.hit.historyEnable=true
extend.hit.resourceExtenderComponent-ref="extend.hitResourceExtenderComponent"
