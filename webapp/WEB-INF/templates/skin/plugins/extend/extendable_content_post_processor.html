<script>
document.addEventListener('DOMContentLoaded', function(){
<#--
- Replace all @Extendable[<idResource>,<resourceType>,<extenderType>,<params>]@ to the according social
- content.
- 1 - Fetch all markers
- 2 - For each marker :
- 2A - Build the parameters <idResource>, <resourceType>, <extenderType>, <params>
- 2B - Build the social content given the previous parameters
- 2C - Replace the marker by the content
-->	
<#-- 1 - Fetch all markers -->
var matches = document.body.innerHTML.match(/${extendRegexPattern!}/);
	if (matches) {
		var params = matches[1].split(',');
		<#-- 2A - Build the parameters <idResource>, <resourceType>, <extenderType>, <params> -->
		if (params.length >= 3) {
			var idExtendableResource = params[0];
			var extendableResourceType = params[1];
			var extenderType = params[2];
			var parameters = params.length > 3 ? params[3] : '';
			<#-- 2B - Build the social content given the previous parameters -->
			var queryParams = new URLSearchParams({
				idExtendableResource: idExtendableResource,
				extendableResourceType: extendableResourceType,
				extenderType: extenderType,
				parameters: parameters
		});
			
		fetch('${baseUrl}servlet/plugins/extend?' + queryParams)
			.then(response => response.text())
			.then(socialContent => {
				<#-- 2C - Replace the marker by the content -->
				document.body.innerHTML = document.body.innerHTML.replace(matches[0], socialContent);
			})
			.catch(() => {
				<#-- Replace as an empty string in case of error -->
				document.body.innerHTML = document.body.innerHTML.replace(matches[0], '');
			});
		}
	}
});
</script>
